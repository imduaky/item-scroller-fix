name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Minecraft ${{ matrix.minecraft_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft_version: "26.3"
            java_version: "25"
            loader_version: "0.19.5"
            itemscroller_version: "0.33.1"
            malilib_version: "0.30.2"
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Java ${{ matrix.java_version }}
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java_version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Build mod
        env:
          MINECRAFT_VERSION: ${{ matrix.minecraft_version }}
          JAVA_VERSION: ${{ matrix.java_version }}
          LOADER_VERSION: ${{ matrix.loader_version }}
          ITEMSCROLLER_VERSION: ${{ matrix.itemscroller_version }}
          MALILIB_VERSION: ${{ matrix.malilib_version }}
        run: |
          gradle_args=(
            "-Pminecraft_version=$MINECRAFT_VERSION"
            "-Pjava_version=$JAVA_VERSION"
            "-Ploader_version=$LOADER_VERSION"
            "-Pitemscroller_version=$ITEMSCROLLER_VERSION"
            "-Pmalilib_version=$MALILIB_VERSION"
          )

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            mod_version="${GITHUB_REF_NAME#v}"
            if [[ ! "$mod_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "Tag must use vX.Y.Z format (optional SemVer suffixes): $GITHUB_REF_NAME" >&2
              exit 1
            fi
            gradle_args+=("-Pmod_version=$mod_version")
          fi

          ./gradlew --no-daemon build "${gradle_args[@]}"

      - name: Upload mod jar
        uses: actions/upload-artifact@v7.0.2
        with:
          name: jars-${{ matrix.minecraft_version }}
          path: |
            build/libs/item-scroller-crafting-fix-${{ matrix.minecraft_version }}-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download mod jars
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: jars-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*.jar)
          if (( ${#assets[@]} == 0 )); then
            echo "No mod jars were downloaded" >&2
            exit 1
          fi

          release_args=("$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          release_version="${GITHUB_REF_NAME#v}"
          release_version="${release_version%%+*}"
          if [[ "$release_version" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"
